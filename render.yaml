# One free web service; database must be provisioned separately on Neon.
services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.lock.txt && npm ci --prefix frontend --no-audit --no-fund && npm run build --prefix frontend
    startCommand: PYTHONPATH=backend python -m atlas.migrate && python -m uvicorn atlas.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: 24.22.1
      - key: ATLAS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: ATLAS_USERNAME
        sync: false
      - key: ATLAS_PASSWORD_HASH
        sync: false
